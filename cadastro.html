<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Cadastro</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;
            color: #222;
            background: #fff;
        }

        .container {
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
        }

        h1 {
            font-size: 20px;
            margin: 0 0 8px 0;
            font-weight: bold;
        }

        .descricao {
            margin-bottom: 12px;
            font-size: 12px;
        }

        fieldset {
            border: 1px solid #999;
            padding: 10px;
            margin: 0 0 10px 0;
        }

        legend {
            font-weight: bold;
            padding: 0 5px;
            font-size: 13px;
        }

        .linha {
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
        }

        .campo {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .campo-pequeno {
            flex: 0 0 22%;
        }

        .campo-medio {
            flex: 0 0 32%;
        }

        .campo-grande {
            flex: 1;
        }

        label {
            font-weight: bold;
            margin-bottom: 3px;
        }

        .obrigatorio::after {
            content: " *";
            color: red;
        }

        input,
        select {
            width: 100%;
            height: 28px;
            border: 1px solid #aaa;
            border-radius: 2px;
            padding: 5px 7px;
            font-size: 12px;
            background-color: white;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #555;
        }

        .checkbox {
            display: flex;
            align-items: center;
            gap: 5px;
            margin: 8px 0;
        }

        .checkbox input {
            width: auto;
            height: auto;
        }

        .checkbox label {
            font-weight: normal;
            margin: 0;
        }

        .checkbox a {
            color: #0000ee;
            text-decoration: underline;
        }

        .btn {
            padding: 6px 14px;
            border: 1px solid #888;
            background: #eee;
            color: #222;
            border-radius: 2px;
            cursor: pointer;
            font-size: 12px;
        }

        .btn:hover {
            background: #ddd;
        }

        @media (max-width: 600px) {
            .linha {
                flex-direction: column;
            }

            .campo-pequeno,
            .campo-medio,
            .campo-grande {
                flex: 1;
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Sistema de Cadastro</h1>

    <div class="descricao">
        Preencha todos os campos abaixo para concluir seu cadastro.
    </div>

    <!-- DADOS PESSOAIS -->
    <fieldset>
        <legend>Dados Pessoais</legend>

        <div class="linha">
            <div class="campo campo-grande">
                <label class="obrigatorio" for="nome">Nome completo</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome completo"
                >
            </div>

            <div class="campo campo-medio">
                <label class="obrigatorio" for="nascimento">
                    Data de nascimento
                </label>
                <input
                    type="date"
                    id="nascimento"
                    name="nascimento"
                >
            </div>
        </div>

        <div class="linha">
            <div class="campo campo-grande">
                <label class="obrigatorio" for="cpf">CPF</label>
                <input
                    type="text"
                    id="cpf"
                    name="cpf"
                    placeholder="000.000.000-00"
                    maxlength="14"
                >
            </div>

            <div class="campo campo-medio">
                <label for="rg">RG</label>
                <input
                    type="text"
                    id="rg"
                    name="rg"
                    placeholder="Digite seu RG"
                >
            </div>
        </div>

        <div class="linha">
            <div class="campo campo-grande">
                <label class="obrigatorio" for="sexo">Sexo</label>
                <select id="sexo" name="sexo">
                    <option value="">Selecione</option>
                    <option value="masculino">Masculino</option>
                    <option value="feminino">Feminino</option>
                    <option value="outro">Outro</option>
                    <option value="nao-informar">Prefiro não informar</option>
                </select>
            </div>
        </div>
    </fieldset>


    <!-- CONTATO -->
    <fieldset>
        <legend>Contato</legend>

        <div class="linha">
            <div class="campo campo-grande">
                <label class="obrigatorio" for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="exemplo@email.com"
                >
            </div>

            <div class="campo campo-medio">
                <label class="obrigatorio" for="telefone">Telefone</label>
                <input
                    type="tel"
                    id="telefone"
                    name="telefone"
                    placeholder="(99) 99999-9999"
                >
            </div>
        </div>

        <div class="linha">
            <div class="campo">
                <label class="obrigatorio" for="endereco">Endereço</label>
                <input
                    type="text"
                    id="endereco"
                    name="endereco"
                    placeholder="Digite seu endereço completo"
                >
            </div>
        </div>

        <div class="linha">
            <div class="campo campo-grande">
                <label class="obrigatorio" for="cidade">Cidade</label>
                <input
                    type="text"
                    id="cidade"
                    name="cidade"
                    placeholder="Digite sua cidade"
                >
            </div>

            <div class="campo campo-medio">
                <label class="obrigatorio" for="estado">Estado</label>
                <select id="estado" name="estado">
                    <option value="">Selecione</option>
                    <option value="AC">Acre</option>
                    <option value="AL">Alagoas</option>
                    <option value="AP">Amapá</option>
                    <option value="AM">Amazonas</option>
                    <option value="BA">Bahia</option>
                    <option value="CE">Ceará</option>
                    <option value="DF">Distrito Federal</option>
                    <option value="ES">Espírito Santo</option>
                    <option value="GO">Goiás</option>
                    <option value="MA">Maranhão</option>
                    <option value="MT">Mato Grosso</option>
                    <option value="MS">Mato Grosso do Sul</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="PA">Pará</option>
                    <option value="PB">Paraíba</option>
                    <option value="PR">Paraná</option>
                    <option value="PE">Pernambuco</option>
                    <option value="PI">Piauí</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="RN">Rio Grande do Norte</option>
                    <option value="RS">Rio Grande do Sul</option>
                    <option value="RO">Rondônia</option>
                    <option value="RR">Roraima</option>
                    <option value="SC">Santa Catarina</option>
                    <option value="SP">São Paulo</option>
                    <option value="SE">Sergipe</option>
                    <option value="TO">Tocantins</option>
                </select>
            </div>
        </div>
    </fieldset>


    <!-- ACESSO -->
    <fieldset>
        <legend>Acesso</legend>

        <div class="linha">
            <div class="campo">
                <label class="obrigatorio" for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                >
            </div>

            <div class="campo">
                <label class="obrigatorio" for="confirmarSenha">
                    Confirme a senha
                </label>
                <input
                    type="password"
                    id="confirmarSenha"
                    name="confirmarSenha"
                    placeholder="Repita sua senha"
                >
            </div>
        </div>
    </fieldset>


    <!-- INFORMAÇÕES ADICIONAIS -->
    <fieldset>
        <legend>Informações Adicionais</legend>

        <div class="linha">
            <div class="campo campo-grande">
                <label for="profissao">Profissão</label>
                <input
                    type="text"
                    id="profissao"
                    name="profissao"
                    placeholder="Digite sua profissão"
                >
            </div>

            <div class="campo campo-medio">
                <label for="estadoCivil">Como você se considera?</label>
                <select id="estadoCivil" name="estadoCivil">
                    <option value="">Selecione</option>
                    <option value="solteiro">Solteiro(a)</option>
                    <option value="casado">Casado(a)</option>
                    <option value="divorciado">Divorciado(a)</option>
                    <option value="viuvo">Viúvo(a)</option>
                </select>
            </div>
        </div>
    </fieldset>


    <!-- TERMOS -->
    <div class="checkbox">
        <input type="checkbox" id="termos" name="termos">

        <label for="termos">
            Li e aceito os
            <a href="#">termos de uso</a>
            e a
            <a href="#">política de privacidade</a>.
        </label>
    </div>

    <button type="submit" class="btn">
        Cadastrar
    </button>

</div>

</body>
</html>
